apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: hotel-key-gateway
  namespace: hotel-key
spec:
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "kong.hotel-key.internal"
        - "*.hotel-key-dev.internal"
      tls:
        httpsRedirect: false
