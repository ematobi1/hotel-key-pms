# Deny all cross-namespace ingress/egress; allow only same-namespace pods and kube-system DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: hotel-key
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}           # same namespace pods only
  egress:
    - to:
        - podSelector: {}           # same namespace pods only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system   # CoreDNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system   # Istio control plane
    # Allow egress to AWS services (RDS, ElastiCache, Secrets Manager) via VPC endpoints
    - ports:
        - protocol: TCP
          port: 5432    # RDS PostgreSQL
        - protocol: TCP
          port: 6379    # ElastiCache Redis
        - protocol: TCP
          port: 443     # AWS APIs (Secrets Manager, ECR, etc.)
