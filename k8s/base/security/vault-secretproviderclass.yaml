apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hotel-key-vault
  namespace: hotel-key
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.hotel-key.internal:8200"
    roleName: "hotel-key-app"
    objects: |
      - objectName: "db-password"
        secretPath: "secret/data/hotelkey/postgres"
        secretKey: "password"
      - objectName: "redis-password"
        secretPath: "secret/data/hotelkey/redis"
        secretKey: "password"
      - objectName: "jwt-secret"
        secretPath: "secret/data/hotelkey/jwt"
        secretKey: "secret"
      - objectName: "stripe-api-key"
        secretPath: "secret/data/hotelkey/stripe"
        secretKey: "api_key"
      - objectName: "wechat-app-secret"
        secretPath: "secret/data/hotelkey/wechat"
        secretKey: "app_secret"
      - objectName: "keycloak-client-secret"
        secretPath: "secret/data/hotelkey/keycloak"
        secretKey: "client_secret"
