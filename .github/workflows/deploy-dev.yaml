name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com
  EKS_CLUSTER_NAME: hotel-key-dev
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - pms-core
          - reservation
          - room-management
          - billing
          - housekeeping
          - maintenance
          - notification
          - channel-manager
          - wechat-connector
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/hotel-key/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/hotel-key/${{ matrix.service }}:latest-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.sha }}

  sync-argocd:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD login
        run: |
          argocd login ${{ env.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
            --grpc-web \
            --insecure

      - name: Update image tags in overlay
        run: |
          IMAGE_TAG=${{ github.sha }}
          for svc in pms-core reservation room-management billing housekeeping maintenance notification channel-manager wechat-connector; do
            cd k8s/overlays/dev
            kustomize edit set image \
              hotel-key/${svc}=${{ env.ECR_REGISTRY }}/hotel-key/${svc}:${IMAGE_TAG}
            cd ../../..
          done

      - name: Commit updated kustomization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: bump dev images to ${{ github.sha }}"
          git push

      - name: ArgoCD app sync
        run: |
          argocd app sync hotel-key-dev \
            --grpc-web \
            --prune \
            --force
          argocd app wait hotel-key-dev \
            --health \
            --timeout 300
